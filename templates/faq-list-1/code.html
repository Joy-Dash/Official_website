<script>
        function toggleAccordion(element) {
            const isActive = element.getAttribute('data-active') === 'true';
            
            // Optional: Close others
            // document.querySelectorAll('.accordion-item').forEach(item => {
            //     item.setAttribute('data-active', 'false');
            // });

            element.setAttribute('data-active', isActive ? 'false' : 'true');
        }
    </script>
<script id="faq-preview-bridge">
(() => {
  const params = new URLSearchParams(window.location.search);
  const pick = (key, fallback = "") => params.get(key) || fallback;
  const setTextFor = (node, value) => {
    if (node && value) node.textContent = value;
  };
  const applyPalette = () => {
    const palette = {
      primary: pick("primary"),
      bg: pick("bg"),
      surface: pick("surface"),
      text: pick("text"),
      muted: pick("muted")
    };
    if (!palette.primary) return;
    document.body.style.background = palette.bg;
    document.body.style.color = palette.text;
    document.querySelector("main")?.style.setProperty("background", palette.bg);
    document.querySelector("section")?.style.setProperty("background", palette.bg);
    document.querySelectorAll(".text-primary").forEach((el) => { el.style.color = palette.primary; });
    document.querySelectorAll(".text-on-surface").forEach((el) => { el.style.color = palette.text; });
    document.querySelectorAll(".text-on-surface-variant, .text-outline, .text-outline-variant").forEach((el) => { el.style.color = palette.muted; });
    document.querySelectorAll(".border-outline-variant\\/30").forEach((el) => { el.style.borderColor = palette.muted; });
  };
  const applyFaq = () => {
    document.querySelectorAll(".accordion-item").forEach((item, index) => {
      const order = index + 1;
      setTextFor(item.querySelector("h3"), pick(`item${order}`));
      setTextFor(item.querySelector("p"), pick(`item${order}Subtitle`));
    });
  };

  applyPalette();
  setTextFor(document.querySelector("header span"), pick("category", "FAQ"));
  setTextFor(document.querySelector("header h1"), pick("title"));
  setTextFor(document.querySelector("header p"), pick("subtitle"));
  applyFaq();
})();
</script>
<script>
(() => {
  const reportHeight = () => parent.postMessage({ type: "front-preview-height", height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) }, "*");
  window.addEventListener("load", reportHeight); window.addEventListener("resize", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  document.querySelectorAll("img").forEach((image) => image.addEventListener("load", reportHeight)); reportHeight();
})();
