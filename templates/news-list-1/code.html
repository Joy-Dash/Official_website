        // Micro-interaction for smooth scrolling or hover effects
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {

                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });

        // Add a subtle reveal animation on scroll for news items
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('opacity-100', 'translate-y-0');
                    entry.target.classList.remove('opacity-0', 'translate-y-8');
                }
            });

<script id="news-preview-bridge">
(() => {
  const params = new URLSearchParams(window.location.search);
  const pick = (key, fallback = "") => params.get(key) || fallback;
  const setText = (selector, value) => {
    if (!value) return;
    const node = document.querySelector(selector);
    if (node) node.textContent = value;
  };
  const applyPalette = () => {
    const palette = {
      primary: pick("primary"),
      bg: pick("bg"),
      surface: pick("surface"),
      text: pick("text"),
      muted: pick("muted")
    };
    if (!palette.primary) return;
    document.body.style.background = palette.bg;
    document.body.style.color = palette.text;
    document.querySelector("main")?.style.setProperty("background", palette.bg);
    document.querySelectorAll(".text-primary").forEach((el) => { el.style.color = palette.primary; });
    document.querySelectorAll(".text-on-surface").forEach((el) => { el.style.color = palette.text; });
    document.querySelectorAll(".text-on-surface-variant, .text-outline").forEach((el) => { el.style.color = palette.muted; });
    document.querySelectorAll(".bg-surface-variant").forEach((el) => { el.style.background = palette.surface; });
  };
  const applyNews = () => {
    document.querySelectorAll("article.news-card").forEach((article, index) => {
      const order = index + 1;
      setTextFor(article.querySelector("time"), pick(`item${order}Date`));
      setTextFor(article.querySelector("h3"), pick(`item${order}`));
      setTextFor(article.querySelector("p"), pick(`item${order}Subtitle`));
    });
  };
  const setTextFor = (node, value) => {
    if (node && value) node.textContent = value;
  };

  applyPalette();
  setText("aside span", pick("category"));
  setText("aside h2", pick("title"));
  setText("aside p", pick("subtitle"));
  const cta = document.querySelector("aside a");
  if (cta) {
    const icon = cta.querySelector(".material-symbols-outlined");
    cta.textContent = pick("cta", "查看更多");
    if (icon) cta.appendChild(icon);
  }
  applyNews();
})();
</script>
<script>
(() => {
  const reportHeight = () => parent.postMessage({ type: "front-preview-height", height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) }, "*");
  window.addEventListener("load", reportHeight); window.addEventListener("resize", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  document.querySelectorAll("img").forEach((image) => image.addEventListener("load", reportHeight)); reportHeight();
})();
</script>
