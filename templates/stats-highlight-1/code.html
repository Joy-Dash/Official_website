<script>
        document.addEventListener('DOMContentLoaded', () => {
            const observerOptions = {
                threshold: 0.2,
                rootMargin: '0px'
            };

            const animateValue = (obj, start, end, duration) => {
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    obj.innerHTML = Math.floor(progress * (end - start) + start);
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        obj.innerHTML = end;
                    }
                };
                window.requestAnimationFrame(step);
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        const target = entry.target;
                        const delay = parseInt(target.getAttribute('data-delay')) || 0;
                        
                        setTimeout(() => {
                            target.classList.add('visible');
                            const numberEl = target.querySelector('[data-value]');
                            if (numberEl) {
                                const endValue = parseInt(numberEl.getAttribute('data-value'));
                                // Respect prefers-reduced-motion
                                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                                    numberEl.innerHTML = endValue;
                                } else {
                                    animateValue(numberEl, 0, endValue, 1500);
                                }
                            }
                        }, delay);
                        
                        observer.unobserve(target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.data-point-reveal').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
<script id="stats-preview-bridge">
(() => {
  const params = new URLSearchParams(window.location.search);
  const pick = (key, fallback = "") => params.get(key) || fallback;
  const setText = (selector, value) => {
    if (!value) return;
    const node = document.querySelector(selector);
    if (node) node.textContent = value;
  };
  const applyPalette = () => {
    const palette = {
      primary: pick("primary"),
      accent: pick("accent"),
      bg: pick("bg"),
      surface: pick("surface"),
      text: pick("text"),
      muted: pick("muted")
    };
    if (!palette.primary) return;
    const contrastColor = (hex, fallback) => {
      const raw = String(hex || "").replace("#", "");
      if (raw.length !== 6) return fallback;
      const r = parseInt(raw.slice(0, 2), 16);
      const g = parseInt(raw.slice(2, 4), 16);
      const b = parseInt(raw.slice(4, 6), 16);
      const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      return luminance > 0.62 ? fallback : hex;
    };
    const numberColor = contrastColor(palette.primary, palette.text);
    document.body.style.background = palette.bg;
    document.body.style.color = palette.text;
    document.querySelector("main")?.style.setProperty("background", palette.bg);
    document.querySelector("section")?.style.setProperty("background", palette.surface);
    document.querySelector("section")?.style.setProperty("border-color", palette.muted);
    document.querySelectorAll(".text-primary").forEach((el) => { el.style.color = palette.primary; });
    document.querySelectorAll(".text-primary-container").forEach((el) => { el.style.color = numberColor; });
    document.querySelectorAll(".text-on-surface").forEach((el) => { el.style.color = palette.text; });
    document.querySelectorAll(".text-on-surface-variant").forEach((el) => { el.style.color = palette.muted; });
    document.querySelectorAll(".border-outline-variant\\/30").forEach((el) => {
      el.style.borderColor = palette.muted;
    });
    document.querySelectorAll(".bg-outline-variant\\/20").forEach((el) => {
      el.style.background = palette.muted;
      el.style.opacity = "0.22";
    });
  };
  const applyStats = () => {
    const numberNodes = document.querySelectorAll("[data-value]");
    numberNodes.forEach((node, index) => {
      const order = index + 1;
      const value = pick(`stat${order}Value`);
      const unit = pick(`stat${order}Unit`);
      const label = pick(`stat${order}Label`);
      if (value) {
        node.dataset.value = value.replace(/,/g, "");
        node.textContent = value;
      }
      const unitNode = node.nextElementSibling;
      if (unitNode && unit) unitNode.textContent = unit;
      const labelNode = node.closest(".data-point-reveal")?.querySelector("p");
      if (labelNode && label) labelNode.textContent = label;
    });
  };

  applyPalette();
  setText("section h2", pick("title"));
  setText("section h2 + p", pick("subtitle"));
  document.querySelector("section a")?.remove();
  applyStats();
})();
</script>
