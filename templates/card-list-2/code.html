<script>
    // Lightweight atmospheric interaction: subtle scroll reveals
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.image-container');
      
      const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('opacity-100');
            entry.target.style.transform = 'translateY(0)';
          }
        });
      }, observerOptions);

      cards.forEach(card => {
        card.parentElement.style.transition = 'all 0.8s cubic-bezier(0.22, 1, 0.36, 1)';
        card.parentElement.style.transform = 'translateY(20px)';
        card.parentElement.classList.add('opacity-0');
        observer.observe(card.parentElement);
      });
    });
  </script>
<script id="cards-preview-bridge">
(() => {
  const params = new URLSearchParams(window.location.search);
  const pick = (key, fallback = "") => params.get(key) || fallback;
  const applyPalette = () => {
    const palette = {
      primary: pick("primary"),
      accent: pick("accent"),
      bg: pick("bg"),
      surface: pick("surface"),
      text: pick("text"),
      muted: pick("muted")
    };
    if (!palette.primary) return;
    document.body.style.background = palette.bg;
    document.body.style.color = palette.text;
    document.querySelector("main")?.style.setProperty("background", palette.bg);
    document.querySelectorAll(".text-primary").forEach((el) => { el.style.color = palette.primary; });
    document.querySelectorAll(".text-on-surface").forEach((el) => { el.style.color = palette.text; });
    document.querySelectorAll(".text-on-surface-variant").forEach((el) => { el.style.color = palette.muted; });
    document.querySelectorAll(".bg-surface-container").forEach((el) => { el.style.background = palette.surface; });
    document.querySelectorAll(".card-hover-overlay").forEach((el) => {
      el.style.background = `linear-gradient(180deg, transparent, ${palette.primary}55)`;
    });
  };
  const applyCards = () => {
    document.querySelectorAll("main .grid > div").forEach((card, index) => {
      const order = index + 1;
      const title = pick(`item${order}`);
      const subtitle = pick(`item${order}Subtitle`);
      const linkEnabled = pick(`item${order}LinkEnabled`, "1") === "1";
      const linkText = pick(`item${order}LinkText`);
      const titleNode = card.querySelector("h3");
      const subtitleNode = card.querySelector("p");
      const linkNode = card.querySelector("a");
      if (titleNode && title) titleNode.textContent = title;
      if (subtitleNode && subtitle) subtitleNode.textContent = subtitle;
      if (linkNode) {
        if (linkEnabled && linkText) {
          const arrow = linkNode.querySelector(".arrow");
          linkNode.textContent = `${linkText} `;
          if (arrow) linkNode.appendChild(arrow);
        } else {
          linkNode.remove();
        }
      }
    });
  };

  applyPalette();
  applyCards();
})();
</script>
<script>
(() => {
  const reportHeight = () => parent.postMessage({ type: "front-preview-height", height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) }, "*");
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  document.querySelectorAll("img").forEach((image) => image.addEventListener("load", reportHeight));
  reportHeight();
})();
</script>
