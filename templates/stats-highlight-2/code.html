<script>
    document.addEventListener('DOMContentLoaded', () => {
        const counters = document.querySelectorAll('.counter');
        const observerOptions = {
            threshold: 0.1
        };

        const counterObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const target = entry.target;
                    const targetValue = parseInt(target.getAttribute('data-target'));
                    const duration = 2500; 
                    const startTime = performance.now();

                    const updateCounter = (currentTime) => {
                        const elapsedTime = currentTime - startTime;
                        const progress = Math.min(elapsedTime / duration, 1);
                        
                        // Easing function (easeOutQuart)
                        const easeProgress = 1 - Math.pow(1 - progress, 4);
                        const currentValue = Math.floor(easeProgress * targetValue);
                        
                        target.innerText = currentValue.toLocaleString();

                        if (progress < 1) {
                            requestAnimationFrame(updateCounter);
                        } else {
                            target.innerText = targetValue.toLocaleString();
                        }
                    };

                    requestAnimationFrame(updateCounter);
                    observer.unobserve(target);
                }
            });
        }, observerOptions);

        counters.forEach(counter => {
            counterObserver.observe(counter);
        });

        // Separate observer for fade-in animations
        const fadeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    fadeObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in-up').forEach(el => {
            fadeObserver.observe(el);
        });
    });
</script>




<script id="stats-preview-bridge">
(() => {
  const params = new URLSearchParams(window.location.search);
  const pick = (key, fallback = "") => params.get(key) || fallback;
  const setText = (selector, value) => {
    if (!value) return;
    const node = document.querySelector(selector);
    if (node) node.textContent = value;
  };
  const applyPalette = () => {
    const palette = {
      primary: pick("primary"),
      accent: pick("accent"),
      bg: pick("bg"),
      surface: pick("surface"),
      text: pick("text"),
      muted: pick("muted")
    };
    if (!palette.primary) return;
    const darkBase = palette.text || "#0b1f2a";
    document.body.style.background = darkBase;
    document.querySelector("section")?.style.setProperty("background", darkBase);
    document.querySelectorAll(".text-primary-fixed-dim").forEach((el) => { el.style.color = palette.accent || palette.primary; });
    document.querySelectorAll(".text-white").forEach((el) => { el.style.color = palette.surface || "#fff"; });
    document.querySelectorAll(".text-white\\/70, .text-white\\/60").forEach((el) => { el.style.color = palette.bg || "#eef4f5"; });
    document.querySelectorAll("svg path").forEach((el) => {
      el.style.stroke = palette.primary;
      el.style.opacity = "0.28";
    });
  };
  const applyStats = () => {
    const numberNodes = document.querySelectorAll(".counter");
    numberNodes.forEach((node, index) => {
      const order = index + 1;
      const value = pick(`stat${order}Value`);
      const unit = pick(`stat${order}Unit`);
      const label = pick(`stat${order}Label`);
      if (value) {
        node.dataset.target = value.replace(/,/g, "");
        node.textContent = value;
      }
      const unitNode = node.nextElementSibling;
      if (unitNode && unit) unitNode.textContent = unit;
      const labelNode = node.closest(".flex-col")?.querySelector("p");
      if (labelNode && label) labelNode.textContent = label;
    });
  };

  applyPalette();
  setText("section h2", pick("title"));
  setText("section h2 + p", pick("subtitle"));
  applyStats();
})();
</script>
