<style>
    body {
      background-color: #faf8ff;
      overflow-x: hidden;
    }

    .panel-container {
      height: 85vh;
      min-height: 600px;
    }

    /* Interactive Desktop Grid */
    .scenario-grid {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 2px;
      transition: all 600ms cubic-bezier(0.25, 1, 0.5, 1);
    }

    .scenario-panel {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      transition: flex 600ms cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
    }

    /* Default state: Expanded for the first panel */
    .scenario-panel:first-child {
      flex: 1.6;
    }

    /* Hover interactions */
    .scenario-grid:hover .scenario-panel {
      flex: 0.8;
    }

    .scenario-grid .scenario-panel:hover {
      flex: 1.6;
    }

    /* Image zoom effect */
    .panel-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 800ms cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 0;
    }

    .scenario-panel:hover .panel-bg {
      transform: scale(1.05);
    }

    /* Gradient Overlay */
    .panel-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    /* Content Visibility Controls */
    .full-description {
      opacity: 0;
      transform: translateY(10px);
      transition: all 400ms ease-out 200ms;
      max-height: 0;
      overflow: hidden;
    }

    .scenario-panel:hover .full-description,
    .scenario-panel:first-child:not(.scenario-grid:hover .scenario-panel) .full-description {
      opacity: 1;
      transform: translateY(0);
      max-height: 100px;
    }

    /* Hide descriptions on non-hovered items when container is hovered */
    .scenario-grid:hover .scenario-panel:not(:hover) .full-description {
      opacity: 0;
      max-height: 0;
    }

    /* Mobile handling: Horizontal Scroll */
    @media (max-width: 768px) {
      .scenario-grid {
        flex-direction: row;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 12px;
        padding: 0 20px;
      }
      .scenario-panel {
        flex: 0 0 85% !important;
        height: 70vh;
        scroll-snap-align: center;
        border-radius: 12px;
      }
      .full-description {
        opacity: 1 !important;
        max-height: none !important;
        transform: none !important;
      }
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
  </style>

<script id="cards-preview-bridge">
(() => {
  const params = new URLSearchParams(window.location.search);
  const pick = (key, fallback = "") => params.get(key) || fallback;
  const applyPalette = () => {
    const palette = {
      primary: pick("primary"),
      accent: pick("accent"),
      bg: pick("bg"),
      surface: pick("surface"),
      text: pick("text"),
      muted: pick("muted")
    };
    if (!palette.primary) return;
    document.body.style.background = palette.bg;
    document.querySelector("main")?.style.setProperty("background", palette.bg);
    document.querySelectorAll(".panel-overlay").forEach((el) => {
      el.style.background = `linear-gradient(180deg, rgba(0,0,0,0.1), ${palette.text}dd)`;
    });
    document.querySelectorAll(".scenario-panel").forEach((el) => {
      el.style.outlineColor = palette.primary;
    });
    document.querySelectorAll("a").forEach((el) => {
      el.style.color = "#fff";
    });
  };
  const applyCards = () => {
    const count = Math.min(4, Math.max(2, Number(pick("itemCount", "4")) || 4));
    const grid = document.querySelector(".scenario-grid");
    let panels = Array.from(document.querySelectorAll(".scenario-panel"));
    panels.forEach((panel, index) => {
      if (index >= count) panel.remove();
    });
    panels = Array.from(document.querySelectorAll(".scenario-panel"));
    if (grid) grid.dataset.count = String(count);
    panels.forEach((panel, index) => {
      const order = index + 1;
      const title = pick(`item${order}`);
      const subtitle = pick(`item${order}Subtitle`);
      const linkEnabled = pick(`item${order}LinkEnabled`, "1") === "1";
      const linkText = pick(`item${order}LinkText`);
      const titleNode = panel.querySelector("h2");
      const subtitleNode = panel.querySelector("p");
      const linkNode = panel.querySelector("a");
      if (titleNode && title) titleNode.textContent = title;
      if (subtitleNode && subtitle) subtitleNode.textContent = subtitle;
      if (linkNode) {
        if (linkEnabled && linkText) {
          const icon = linkNode.querySelector(".material-symbols-outlined");
          linkNode.textContent = linkText;
          if (icon) linkNode.appendChild(icon);
        } else {
          linkNode.remove();
        }
      }
    });
  };

  applyPalette();
  applyCards();
})();
</script>
<script>
(() => {
  const reportHeight = () => parent.postMessage({ type: "front-preview-height", height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) }, "*");
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  document.querySelectorAll("img").forEach((image) => image.addEventListener("load", reportHeight));
  reportHeight();
})();
