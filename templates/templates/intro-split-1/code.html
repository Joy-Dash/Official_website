<style>
        :root {
            --reveal-duration: 1.2s;
            --stagger-delay: 0.2s;
        }

        body {
            background-color: #faf8ff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Image Mask Animation */
        .image-reveal-mask {
            position: relative;
            overflow: hidden;
        }
        
        .image-reveal-mask::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #faf8ff;
            transform: translateX(0);
            transition: transform var(--reveal-duration) cubic-bezier(0.77, 0, 0.175, 1);
        }

        .revealed .image-reveal-mask::after {
            transform: translateX(101%);
        }

        /* Text Slide Up Animation */
        .slide-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                        transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .revealed .slide-up {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-1 { transition-delay: calc(var(--reveal-duration) * 0.4); }
        .delay-2 { transition-delay: calc(var(--reveal-duration) * 0.4 + var(--stagger-delay)); }
        .delay-3 { transition-delay: calc(var(--reveal-duration) * 0.4 + var(--stagger-delay) * 2); }
        .delay-4 { transition-delay: calc(var(--reveal-duration) * 0.4 + var(--stagger-delay) * 3); }

        .image-scale {
            transition: transform 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: scale(1.1);
        }

        .revealed .image-scale {
            transform: scale(1);
        }
    </style>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const module = document.getElementById('content-module');
            
            // Trigger animation on load
            setTimeout(() => {
                module.classList.add('revealed');
            }, 300);

            // Optional: Re-trigger on intersection if scrolled
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('revealed');
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(module);
        });
    </script>
<script id="module-preview-bridge">
(() => {
  const params = new URLSearchParams(window.location.search);
  const pick = (key, fallback = "") => params.get(key) || fallback;
  const setText = (selector, value) => {
    if (!value) return;
    const node = document.querySelector(selector);
    if (node) node.textContent = value;
  };
  const applyImage = (imageUrl) => {
    if (!imageUrl) return;
    const image = document.querySelector("#content-module img");
    if (image) image.src = imageUrl;
  };
  const applyPalette = () => {
    const palette = {
      primary: pick("primary"),
      accent: pick("accent"),
      bg: pick("bg"),
      surface: pick("surface"),
      text: pick("text"),
      muted: pick("muted")
    };
    if (!palette.primary) return;
    document.body.style.background = palette.bg;
    document.body.style.color = palette.text;
    document.querySelectorAll(".bg-surface-bright, .bg-background").forEach((el) => { el.style.background = palette.bg; });
    document.querySelectorAll(".bg-primary").forEach((el) => { el.style.background = palette.primary; });
    document.querySelectorAll(".text-primary").forEach((el) => { el.style.color = palette.primary; });
    document.querySelectorAll(".text-on-surface").forEach((el) => { el.style.color = palette.text; });
    document.querySelectorAll(".text-on-surface-variant").forEach((el) => { el.style.color = palette.muted; });
  };
  applyPalette();

  setText("#content-module h1", pick("title"));
  setText("#content-module p", pick("subtitle"));

  let imageUrl = pick("imageUrl");
  const imageKey = pick("imageKey");
  if (!imageUrl && imageKey) {
    try {
      imageUrl = sessionStorage.getItem(imageKey) || "";
    } catch (error) {}
  }
  applyImage(imageUrl);

  window.addEventListener("message", (event) => {
    if (event.data?.type !== "hero-preview-image" || !event.data.imageUrl) return;
    applyImage(event.data.imageUrl);
  });
})();
</script>
<script>
(() => {
  const reportHeight = () => parent.postMessage({ type: "front-preview-height", height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) }, "*");
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  document.querySelectorAll("img").forEach((image) => image.addEventListener("load", reportHeight));
  reportHeight();
})();
</script>
