<script id="hero-preview-bridge">
(() => {
  const params = new URLSearchParams(window.location.search);
  const pick = (key, fallback = "") => params.get(key) || fallback;
  const linkEnabled = params.get("linkEnabled") === "1";
  const setText = (selector, value) => {
    if (!value) return;
    const el = document.querySelector(selector);
    if (el) el.textContent = value;
  };
  const setButton = (btn, value) => {
    if (!btn) return;
    const icon = btn.querySelector(".material-symbols-outlined");
    btn.textContent = value;
    if (icon) btn.prepend(icon);
  };
  const applyPalette = () => {
    const palette = {
      primary: pick("primary"),
      accent: pick("accent"),
      bg: pick("bg"),
      surface: pick("surface"),
      text: pick("text"),
      muted: pick("muted")
    };
    if (!palette.primary) return;
    document.body.style.background = palette.bg;
    document.body.style.color = palette.text;
    document.querySelectorAll(".text-primary").forEach((el) => { el.style.color = palette.primary; });
    document.querySelectorAll(".text-on-surface").forEach((el) => { el.style.color = palette.text; });
    document.querySelectorAll(".text-on-surface-variant").forEach((el) => { el.style.color = palette.muted; });
    document.querySelectorAll(".bg-primary-container, .bg-primary").forEach((el) => {
      el.style.background = palette.primary;
      el.style.color = "#fff";
    });
    document.querySelectorAll(".border-primary").forEach((el) => { el.style.borderColor = palette.primary; });
    document.querySelectorAll(".bg-white, .bg-surface, .bg-surface-bright").forEach((el) => { el.style.background = palette.surface; });
    document.querySelectorAll(".bg-surface-container-low").forEach((el) => { el.style.background = palette.bg; });
  };
  applyPalette();
  document.querySelector("header")?.remove();
  document.querySelectorAll("button").forEach((btn) => { btn.style.display = "none"; });
  setText("h1", pick("title"));
  setText("section span.font-label-md", pick("subtitle"));
  document.querySelector("section p.font-body-lg")?.remove();
  let imageUrl = pick("imageUrl");
  const imageKey = pick("imageKey");
  if (!imageUrl && imageKey) {
    try {
      imageUrl = sessionStorage.getItem(imageKey) || "";
    } catch (error) {}
  }
  if (imageUrl) {
    const image = document.querySelector("section.relative.w-full img");
    if (image) image.src = imageUrl;
  }
  window.addEventListener("message", (event) => {
    if (event.data?.type !== "hero-preview-image" || !event.data.imageUrl) return;
    const image = document.querySelector("section.relative.w-full img");
    if (image) image.src = event.data.imageUrl;
  });
  const primaryButton = document.querySelector("main section button.bg-primary-container");
  if (linkEnabled) {
    setButton(primaryButton, pick("cta", "查看更多"));
    if (primaryButton) primaryButton.style.display = "inline-flex";
  }
})();
</script>
<script>
    // Scroll effect for Navbar
    window.addEventListener('scroll', () => {
        const nav = document.querySelector('header');
        if (window.scrollY > 50) {
            nav.classList.add('bg-white/80', 'blur-backdrop', 'shadow-sm');
        } else {
            nav.classList.remove('bg-white/80', 'blur-backdrop', 'shadow-sm');
        }
    });
</script>
<script>
(() => {
  const reportHeight = () => parent.postMessage({ type: "front-preview-height", height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) }, "*");
  window.addEventListener("load", reportHeight); window.addEventListener("resize", reportHeight);
  new ResizeObserver(reportHeight).observe(document.documentElement);
  document.querySelectorAll("img").forEach((image) => image.addEventListener("load", reportHeight)); reportHeight();
})();
</script>
