<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A/B 方案後台功能頁原型</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #f1f4f7;
      --text: #19202a;
      --muted: #657184;
      --line: #d9e0e8;
      --brand: #2563eb;
      --brand-soft: #eaf1ff;
      --ok: #16835b;
      --warn: #a15c08;
      --danger: #b42318;
      --shadow: 0 10px 26px rgba(25, 32, 42, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 230px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .brand-title {
      font-weight: 700;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .plan-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn,
    .btn,
    .icon-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 7px;
      min-height: 36px;
      padding: 8px 12px;
    }

    .tab-btn.active,
    .btn.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--panel-2);
      display: grid;
      place-items: center;
      color: var(--text);
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 18px 14px;
      overflow: auto;
      max-height: calc(100vh - 65px);
      position: sticky;
      top: 65px;
    }

    .side-section-title {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      margin: 16px 10px 8px;
    }

    .nav-list {
      display: grid;
      gap: 4px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--text);
      border-radius: 7px;
      padding: 9px 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .nav-btn small {
      color: var(--muted);
      font-size: 12px;
    }

    main {
      padding: 24px;
      min-width: 0;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      line-height: 1.25;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .page-desc {
      color: var(--muted);
      max-width: 820px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two {
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      min-width: 0;
    }

    .plain-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      min-width: 0;
    }

    .metric {
      display: grid;
      gap: 4px;
    }

    .metric-value {
      font-size: 26px;
      font-weight: 700;
    }

    .muted,
    .hint {
      color: var(--muted);
    }

    .hint {
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      background: var(--panel-2);
      color: var(--muted);
      white-space: nowrap;
    }

    .badge.ok {
      background: #e7f6ef;
      color: var(--ok);
    }

    .badge.warn {
      background: #fff4df;
      color: var(--warn);
    }

    .badge.brand {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 7px;
      padding: 9px 10px;
      min-height: 38px;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    .content-type-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .content-type-tabs .tab-btn {
      min-height: 34px;
      padding: 7px 11px;
    }

    .editor-textarea {
      min-height: 260px;
      line-height: 1.7;
    }

    .field-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: -2px;
    }

    .status-pin-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 0.45fr);
      gap: 14px;
      align-items: end;
    }

    .pin-control {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 10px;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
    }

    .pin-control.disabled {
      color: var(--muted);
      background: var(--panel-2);
    }

    .pin-control.disabled .switch {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }

    .toggle-row:last-child {
      border-bottom: 0;
    }

    .switch {
      width: 44px;
      height: 24px;
      border: 0;
      border-radius: 999px;
      background: var(--brand);
      padding: 3px;
      display: flex;
      justify-content: flex-end;
      flex: none;
    }

    .switch.off {
      background: #a7b0bf;
      justify-content: flex-start;
    }

    .knob {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 700;
      background: var(--panel-2);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input {
      min-width: 230px;
    }

    .checklist {
      display: grid;
      gap: 9px;
    }

    .check-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
    }

    .check-mark {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e7f6ef;
      color: var(--ok);
      font-size: 13px;
      font-weight: 700;
    }

    .check-mark.warn {
      background: #fff4df;
      color: var(--warn);
    }

    .flow-list {
      display: grid;
      gap: 10px;
    }

    .flow-item {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .flow-num {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--brand-soft);
      color: var(--brand);
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .preview-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .browser-bar {
      color: var(--muted);
      font-size: 13px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .serp-title {
      color: #1a0dab;
      font-size: 18px;
    }

    .serp-url {
      color: #188038;
      font-size: 13px;
    }

    .mini-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .mini-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .mini-list li:last-child {
      border-bottom: 0;
    }

    .relation-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .relation-box {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 230px minmax(0, 1fr);
      }

      .grid.two,
      .grid.three {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 780px) {
      .topbar,
      .page-head {
        align-items: stretch;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        padding: 16px;
      }

      .form-grid,
      .status-pin-row,
      .relation-grid {
        grid-template-columns: 1fr;
      }

      .search-input {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">CMS</div>
        <div>
          <div class="brand-title">品牌官網後台原型</div>
          <div class="brand-subtitle">A 基本版 / B 進階版功能頁</div>
        </div>
      </div>
      <div class="plan-tabs" aria-label="方案切換">
        <button class="tab-btn active" type="button" data-plan="a">A 基本版</button>
        <button class="tab-btn" type="button" data-plan="b">B 進階版</button>
      </div>
      <div class="user-box">
        <span>Dash Joy</span>
        <span class="avatar">J</span>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="side-section-title">後台功能</div>
        <nav class="nav-list" id="navList" aria-label="後台功能選單"></nav>
      </aside>

      <main>
        <div class="page-head">
          <div>
            <h1 id="pageTitle"></h1>
            <div class="page-desc" id="pageDesc"></div>
          </div>
          <div class="actions" id="pageActions"></div>
        </div>
        <div id="pageContent"></div>
      </main>
    </div>
  </div>

  <script>

    const advancedPages = [

      return pagesForPlan().reduce((groups, page) => {

        title.textContent = group;
        navList.appendChild(title);

        groups[group].forEach((page) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "nav-btn" + (page.id === state.page ? " active" : "");
          btn.innerHTML = `<span>${page.label}</span>${state.plan === "b" && advancedPages.some((p) => p.id === page.id) ? "<small>B</small>" : ""}`;
          btn.addEventListener("click", () => {
            state.page = page.id;
            render();

          navList.appendChild(btn);
        });

    function initializeArticleControls() {
      pageContent.querySelectorAll(".status-pin-row").forEach((row) => {
        const status = row.querySelector(".status-select");
        const pinControl = row.querySelector(".pin-control");
        const pinSwitch = row.querySelector(".pin-switch");
        if (!status || !pinControl || !pinSwitch) return;

        const syncPinState = () => {
          const canPin = status.value === "已發布";
          pinControl.classList.toggle("disabled", !canPin);
          pinSwitch.setAttribute("aria-disabled", String(!canPin));
          if (!canPin) {
            pinSwitch.classList.add("off");
            pinSwitch.setAttribute("aria-pressed", "false");
          }
        };

        status.addEventListener("change", syncPinState);
        pinSwitch.addEventListener("click", () => {
          if (status.value !== "已發布") return;
          const isPressed = pinSwitch.getAttribute("aria-pressed") === "true";
          pinSwitch.classList.toggle("off", isPressed);
          pinSwitch.setAttribute("aria-pressed", String(!isPressed));
        });
        syncPinState();
      });
    }

    function render() {
      const pages = pagesForPlan();
      if (!pages.some((page) => page.id === state.page)) state.page = "overview";
      const page = currentPage();
      document.querySelectorAll(".tab-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.plan === state.plan);
      });
      renderNav();
      pageTitle.textContent = page.label;
      pageDesc.textContent = page.id === "articles"
        ? "以大內文編輯區為主，外部只保留標題、SEO、網址、封面、摘要與少量類型欄位。"
        : page.id === "cases"
          ? "案例也以大內文為主，外部只填客戶、產業、服務與成果摘要等前台卡片會用到的資訊。"
          : page.desc;
      actionButtons(page.actions);
      pageContent.innerHTML = renderContent(page);
      initializeArticleControls();
    }

    document.querySelectorAll(".tab-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.plan = button.dataset.plan;
        state.page = "overview";
        render();
      });
    });

    render();
  </script>
</body>
</html>
