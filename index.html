<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>官網首頁雙版型預覽</title>
    <style>
      :root {
        --ink: #24211d;
        --muted: #726d65;
        --paper: #f7f1e8;
        --line: rgba(36, 33, 29, 0.16);
        --accent-a: #9f5d45;
        --accent-b: #1f4d58;
        --max: 1120px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Noto Sans TC",
          "PingFang TC",
          "Microsoft JhengHei",
          system-ui,
          sans-serif;
        color: var(--ink);
        background:
          linear-gradient(105deg, rgba(159, 93, 69, 0.13), transparent 32%),
          linear-gradient(260deg, rgba(31, 77, 88, 0.15), transparent 38%),
          var(--paper);
      }

      main {
        width: min(var(--max), calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 8vw, 7.6rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .intro {
        max-width: 680px;
        margin: 28px 0 56px auto;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.24rem);
        line-height: 1.9;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .preview {
        position: relative;
        min-height: 420px;
        padding: 28px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: rgba(255, 252, 246, 0.72);
      }

      .preview::before {
        position: absolute;
        inset: auto 24px 24px auto;
        color: rgba(36, 33, 29, 0.08);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 8rem;
        line-height: 1;
      }

      .preview-a::before {
        content: "A";
      }

      .preview-b::before {
        content: "B";
      }

      .preview h2 {
        position: relative;
        max-width: 390px;
        margin: 0 0 18px;
        font-size: clamp(1.8rem, 3vw, 3.1rem);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .preview p {
        position: relative;
        max-width: 460px;
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .motif {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 88px;
        height: 130px;
        border: 1px solid var(--line);
      }

      .preview-a .motif {
        border-radius: 0 70px 70px 0;
        background:
          radial-gradient(circle at 25% 42%, rgba(159, 93, 69, 0.28), transparent 28%),
          linear-gradient(115deg, rgba(159, 93, 69, 0.2), rgba(31, 77, 88, 0.08));
        clip-path: ellipse(70% 64% at 44% 50%);
      }

      .preview-b .motif {
        display: grid;
        grid-template-columns: 1.4fr 0.55fr 0.85fr;
        gap: 10px;
        border: 0;
        background: transparent;
      }

      .preview-b .motif span {
        display: block;
        border: 1px solid var(--line);
        background: rgba(36, 33, 29, 0.07);
      }

      .preview-b .motif span:nth-child(2) {
        margin-top: 38px;
        background: rgba(31, 77, 88, 0.18);
      }

      .preview-b .motif span:nth-child(3) {
        height: 78px;
        margin-top: 12px;
        background: rgba(159, 93, 69, 0.16);
      }

      a {
        position: absolute;
        left: 28px;
        bottom: 28px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
      }

      a::after {
        content: "";
        width: 42px;
        height: 1px;
        background: currentColor;
        transition: width 0.2s ease;
      }

      a:hover::after {
        width: 68px;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 28px, var(--max));
          padding: 44px 0;
        }

        .intro {
          margin: 24px 0 36px;
        }

        .preview-grid {
          grid-template-columns: 1fr;
        }

        .preview {
          min-height: 370px;
          padding: 22px;
        }

        a {
          left: 22px;
          bottom: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Homepage Concepts / Two Distinct Directions</p>
      <h1>兩套官網首頁版型</h1>
      <p class="intro">
        這裡收錄本次製作的兩個首頁方向。版型 A 著重流動、故事與品牌溫度；版型 B
        著重字體比例、錯位構圖與現代型錄感。兩套皆可直接開啟預覽。
      </p>
      <section class="preview-grid" aria-label="版型預覽入口">
        <article class="preview preview-a">
          <h2>流線品牌敘事型</h2>
          <p>以曲線、弧形裁切與跨區圖片串接內容，讓品牌理念、服務流程與案例自然往下延展。</p>
          <div class="motif" aria-hidden="true"></div>
          <a href="./template-a/index.html">開啟版型 A</a>
        </article>
        <article class="preview preview-b">
          <h2>現代編輯雜誌型</h2>
          <p>以大標題、不等寬欄位、裁切影像與數字線條建立成熟俐落的品牌型錄節奏。</p>
          <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
          <a href="./template-b/index.html">開啟版型 B</a>
        </article>
      </section>
    </main>
  </body>
</html>
