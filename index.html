<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首頁模塊 Builder Demo</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="admin-topbar" aria-label="後台系統列">
      <div class="admin-brand-banner">
        <div class="admin-brand-mark" aria-hidden="true">利</div>
        <div>
          <strong>利每家官網後台</strong>
          <span>智慧富氫水站內容管理系統</span>
        </div>
      </div>
      <div class="admin-topbar-actions">
        <button class="theme-toggle" type="button" id="themeToggle" aria-label="切換深色模式" title="切換深色模式">
          <span class="theme-toggle-icon" aria-hidden="true">Dark</span>
          <span class="theme-toggle-text">深色</span>
        </button>
        <details class="admin-account-menu">
          <summary aria-label="開啟帳號選單">
            <span class="admin-avatar" aria-hidden="true">J</span>
            <span class="admin-account-copy">
              <strong>Joy</strong>
              <small>最高管理者</small>
            </span>
            <span class="admin-account-chevron" aria-hidden="true">⌄</span>
          </summary>
          <div class="admin-account-dropdown">
            <button type="button">登出</button>
          </div>
        </details>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <aside class="panel admin-panel" id="adminPanel">
        <div class="panel-head">
          <div>
            <h1>後台：官網設定</h1>
            <p>先設定整站官網模板與色系，再管理首頁模塊、前台頁面與後台資料。</p>
          </div>
          <div class="admin-head-side">
          <div id="adminHeaderTemplateSlot"></div>
          <div class="actions admin-head-actions">
            <button class="btn hidden" type="button" id="backHomeOverviewBtn">返回首頁現況</button>
            <button class="btn primary" type="button" id="saveBtn">儲存</button>
          </div>
          </div>
        </div>

        <div class="admin-layout">
          <nav class="backend-nav" aria-label="後台功能列">
            <button class="nav-group-toggle" type="button" data-nav-group-toggle="siteSettings" aria-expanded="true">
              <span>網站設定</span>
              <span class="nav-group-chevron" aria-hidden="true">−</span>
            </button>
            <div class="nav-group" data-nav-group="siteSettings">
              <button type="button" data-admin-section="brandStyle">品牌樣式設定</button>
              <button type="button" data-admin-section="siteBasicInfo">官網基本資訊</button>
              <button type="button" data-admin-section="seo">SEO 管理</button>
              <button type="button" data-admin-section="tracking">追蹤設定</button>
              <button type="button" data-admin-section="site">網站設定</button>
            </div>
            <button class="nav-group-toggle" type="button" data-nav-group-toggle="content" aria-expanded="true">
              <span>內容管理</span>
              <span class="nav-group-chevron" aria-hidden="true">−</span>
            </button>
            <div class="nav-group" data-nav-group="content">
              <button class="is-active" type="button" data-admin-section="home">首頁管理</button>
              <button type="button" data-admin-section="pages">前台頁面</button>
              <button type="button" data-admin-section="blueprintArticles">文章管理</button>
              <button type="button" data-admin-section="blueprintFaq">FAQ 管理</button>
              <button type="button" data-admin-section="blueprintProducts">商品 / 服務資料</button>
              <button type="button" data-admin-section="blueprintResources">據點 / 資源資料</button>
            </div>
            <button class="nav-group-toggle" type="button" data-nav-group-toggle="interaction" aria-expanded="true">
              <span>互動紀錄</span>
              <span class="nav-group-chevron" aria-hidden="true">−</span>
            </button>
            <div class="nav-group" data-nav-group="interaction">
              <button type="button" data-admin-section="contactRecords">聯絡表單紀錄</button>
              <button type="button" data-admin-section="supportMessages">客服訊息管理</button>
            </div>
            <button class="nav-group-toggle" type="button" data-nav-group-toggle="accounts" aria-expanded="true">
              <span>帳號權限</span>
              <span class="nav-group-chevron" aria-hidden="true">−</span>
            </button>
            <div class="nav-group" data-nav-group="accounts">
              <button type="button" data-admin-section="adminRoles">角色權限管理</button>
              <button type="button" data-admin-section="adminUsers">後台帳號管理</button>
            </div>
            <button class="nav-group-toggle" type="button" data-nav-group-toggle="maintenance" aria-expanded="true">
              <span>系統維運</span>
              <span class="nav-group-chevron" aria-hidden="true">−</span>
            </button>
            <div class="nav-group" data-nav-group="maintenance">
              <button type="button" data-admin-section="logs">操作紀錄</button>
            </div>
          </nav>

          <section class="module-sidebar">
            <div class="toolbar">
              <div>
                <h2>首頁模塊</h2>
                <p>拖曳排序；Hero 與 Footer 固定。</p>
              </div>
              <button class="btn primary" type="button" id="addModuleBtn">新增模塊</button>
            </div>
            <div class="summary" id="summary"></div>
            <div class="module-list" id="moduleList"></div>
          </section>

          <section class="settings-panel">
            <h2 id="settingsTitle">模塊設定</h2>
            <div id="settingsRoot"></div>
          </section>

          <section class="manager-panel hidden" id="managerPanel"></section>
        </div>
      </aside>
    </main>
  </div>

  <script src="./src/app.js"></script>
</body>
</html>
